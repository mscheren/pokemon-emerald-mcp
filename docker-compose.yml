services:
  mgba:
    build: .
    command: >
      bash -c "
        Xvfb :99 -screen 0 240x160x24 &
        sleep 1
        DISPLAY=:99 /mgba/mgba-qt
          --script /app/src/lua_scripts/pokemon_agent.lua
          /rom/pokeemerald.gba
      "
    environment:
      - DISPLAY=:99
    volumes:
      - ${ROM_PATH}:/rom/pokeemerald.gba:ro
      - screenshots:/data/screenshots
    expose:
      - "5000"
    restart: unless-stopped

  mcp-server:
    build: .
    command: uv run pokemon-mcp
    environment:
      - MGBA_HOST=mgba
      - MGBA_PORT=5000
      - SCREENSHOT_DIR=/data/screenshots
      - KB_PATH=/data/knowledge/pokemon_knowledge.db
    volumes:
      - knowledge:/data/knowledge
      - screenshots:/data/screenshots
    depends_on:
      - mgba

volumes:
  knowledge:
  screenshots:
