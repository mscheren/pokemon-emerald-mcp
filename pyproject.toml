[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.0.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.6",
]

[project.scripts]
pokemon-agent = "src.agent.cli:main"
pokemon-mgba = "src.agent.cli:launch_mgba"
pokemon-mcp = "src.agent.mcp_server:main"
pokemon-mcp-admin = "src.agent.mcp_server:admin_stop"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
